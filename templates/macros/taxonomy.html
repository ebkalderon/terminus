{%- component taxonomy.prettify(term) -%}
    {%- if taxonomy.name == "categories" -%}
        {{- "{" ~ term ~ "}" | safe -}}
    {%- elif taxonomy.name == "tags" -%}
        {{- "#" ~ term | safe -}}
    {%- else -%}
        {{- term | safe -}}
    {%- endif -%}
{%- endcomponent taxonomy.prettify -%}
